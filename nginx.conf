# 프런트엔드 컨테이너의 nginx 설정
# - 화면(React 빌드 결과)을 서빙하고, /api 요청은 백엔드 컨테이너(gitnyang-backend:3000)로 전달합니다.
#   (개발할 때 vite.config.js 의 프록시가 하던 일을 배포에서는 nginx 가 합니다.)
# - 이 컨테이너 앞에는 ALB 가 있습니다(HTTPS 는 ALB 가 처리). 그래서 이 컨테이너는 HTTP 80 만 받습니다.

# ALB 가 알려 주는 원래 요청 방식(https)을 백엔드에 그대로 전달하기 위한 값
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 프로필 사진 업로드(줄인 이미지, 최대 약 400KB)를 받을 수 있는 크기
    client_max_body_size 2m;

    # 전송 크기를 줄이기 위한 압축
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 기본 보안 헤더 (아래 location 들에서 add_header 를 다시 쓰지 않으므로 모두에 적용됨)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker 내부 DNS. 백엔드 컨테이너가 아직 없거나 재시작 중이어도
    # nginx 자체는 죽지 않고(화면은 계속 제공), /api 요청만 502 로 응답합니다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 서버 API 전달
    location /api/ {
        set $backend http://gitnyang-backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # 빌드 결과 파일(이름에 내용 해시가 붙어 바뀌면 이름도 바뀜)은 오래 캐시
    # 없는 파일은 화면(index.html)이 아니라 404 로 응답
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # 나머지는 모두 React 가 처리: /favorites 처럼 직접 주소로 들어오거나 새로고침해도
    # index.html 을 내려주고, 화면 이동은 react-router 가 담당
    # (ALB 상태 검사가 / 를 호출해도 항상 200)
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;   # index.html 은 캐시하지 않음 (새 버전 배포가 바로 반영되도록)
    }
}
